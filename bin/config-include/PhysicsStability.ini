;; Physics Stability Configuration
;; Prevents physics engine crashes and runaway physics

[PhysicsStability]
    ;; Enable physics stability monitoring (default: true)
    Enabled = true
    
    ;; Maximum physics frame time in milliseconds before intervention
    ;; If physics takes longer than this, stabilization will occur
    MaxPhysicsFrameTime = 500.0
    
    ;; Maximum collisions allowed per frame
    MaxCollisionsPerFrame = 1000
    
    ;; Maximum velocity for objects in meters/second
    ;; Objects exceeding this will be slowed down
    MaxVelocity = 256.0
    
    ;; Maximum angular velocity in radians/second
    MaxAngularVelocity = 30.0
    
    ;; Automatically stabilize physics when problems detected (default: true)
    AutoStabilize = true
    
    ;; Number of physics errors before emergency reset
    PhysicsErrorThreshold = 10
    
    ;; The module will:
    ;; - Monitor physics performance
    ;; - Detect and fix runaway objects
    ;; - Prevent velocity explosions
    ;; - Clear stuck collisions
    ;; - Reset physics in emergencies