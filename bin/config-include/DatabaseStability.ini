;; Database Stability Configuration
;; Prevents database connection failures and provides recovery mechanisms

[DatabaseStability]
    ;; Enable database stability monitoring (default: true)
    Enabled = true
    
    ;; Database connection timeout in milliseconds
    ConnectionTimeout = 30000
    
    ;; Maximum retry attempts for failed connections
    MaxRetryAttempts = 3
    
    ;; Delay between retry attempts in milliseconds
    RetryDelayMs = 1000
    
    ;; Automatically attempt to reconnect failed database connections (default: true)
    AutoReconnect = true
    
    ;; Interval between database health checks in milliseconds (default: 30000)
    HealthCheckInterval = 30000
    
    ;; Maximum database errors before triggering recovery (default: 10)
    MaxDbErrors = 10
    
    ;; The module will:
    ;; - Monitor all database connections for health
    ;; - Automatically retry failed database operations
    ;; - Attempt reconnection when connections fail
    ;; - Track database error statistics
    ;; - Provide emergency database recovery functions
    ;; - Log database connection status and errors