;; Script Engine Stability Configuration
;; Prevents script crashes and manages problematic scripts

[ScriptEngineStability]
    ;; Enable script engine stability monitoring (default: true)
    Enabled = true
    
    ;; Maximum errors allowed per script before suspension
    MaxScriptErrors = 100
    
    ;; Maximum script execution time in milliseconds
    MaxScriptTime = 5000
    
    ;; Maximum scripts allowed per object
    MaxScriptsPerObject = 100
    
    ;; Maximum events processed per second
    MaxEventsPerSecond = 1000
    
    ;; Automatically suspend scripts with too many errors (default: true)
    AutoSuspendBadScripts = true
    
    ;; Automatically restart script engine if it becomes unresponsive (default: true)
    AutoRestartScriptEngine = true
    
    ;; The module will:
    ;; - Monitor script errors and performance
    ;; - Suspend problematic scripts automatically
    ;; - Track script resource usage
    ;; - Restart script engine if needed
    ;; - Provide console commands for script management