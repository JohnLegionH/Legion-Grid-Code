;; Error Handling Configuration
;; Prevents region crashes by catching and handling errors gracefully

[ErrorHandling]
    ;; Enable comprehensive error handling (default: true)
    Enabled = true
    
    ;; Maximum number of errors allowed per minute before protective measures kick in
    ;; If this threshold is exceeded, the system will take protective actions
    MaxErrorsPerMinute = 100
    
    ;; Enable automatic recovery from errors (default: true)
    ;; When enabled, the system will attempt to recover from errors automatically
    AutoRecover = true
    
    ;; Enable verbose error logging for debugging (default: false)
    ;; Turn this on to get detailed stack traces in logs
    VerboseLogging = false
    
    ;; Number of critical errors before emergency procedures are triggered
    CriticalErrorThreshold = 10
    
    ;; Example protective actions taken by AutoRecover:
    ;; - Temporary script disabling after repeated script errors
    ;; - Physics engine reset after physics errors
    ;; - Garbage collection after memory errors
    ;; - Emergency region backup before termination