;; Asset Stability Configuration
;; Prevents asset loading failures and provides recovery mechanisms

[AssetStability]
    ;; Enable asset stability monitoring (default: true)
    Enabled = true
    
    ;; Asset loading timeout in milliseconds
    AssetTimeout = 30000
    
    ;; Maximum retry attempts for failed asset loads
    MaxRetryAttempts = 3
    
    ;; Delay between retry attempts in milliseconds
    RetryDelayMs = 1000
    
    ;; Automatically retry failed asset loads (default: true)
    AutoRetryAssets = true
    
    ;; Maximum asset errors before marking as permanently failed (default: 50)
    MaxAssetErrors = 50
    
    ;; Emergency asset cache cleanup interval in milliseconds (default: 300000 = 5 minutes)
    AssetCacheCleanupInterval = 300000
    
    ;; Enable emergency asset caching for recovery (default: true)
    EnableAssetCaching = true
    
    ;; The module will:
    ;; - Monitor asset loading requests and failures
    ;; - Automatically retry failed asset loads
    ;; - Maintain emergency cache of successful assets
    ;; - Provide default assets as fallbacks
    ;; - Track asset loading statistics
    ;; - Provide asset recovery console commands