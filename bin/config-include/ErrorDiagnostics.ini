;; Error Diagnostics Configuration
;; Comprehensive error logging and diagnostics system

[ErrorDiagnostics]
    ;; Enable error diagnostics and logging (default: true)
    Enabled = true
    
    ;; Directory for diagnostic log files
    LogDirectory = logs/diagnostics
    
    ;; Interval between health reports in milliseconds (default: 300000 = 5 minutes)
    ReportInterval = 300000
    
    ;; Maximum number of errors to keep in memory history
    MaxErrorHistory = 10000
    
    ;; Enable detailed error logging to files (default: true)
    EnableDetailedLogging = true
    
    ;; Enable system performance tracking (default: true)
    EnablePerformanceTracking = true
    
    ;; Enable automatic system health reports (default: true)
    EnableSystemHealthReports = true
    
    ;; Maximum log file size before rotation in bytes (default: 10485760 = 10MB)
    MaxLogFileSize = 10485760
    
    ;; The module will:
    ;; - Collect and categorize all system errors
    ;; - Monitor system health and performance metrics
    ;; - Generate periodic health reports
    ;; - Export diagnostic data for analysis
    ;; - Provide console commands for error investigation
    ;; - Maintain detailed error logs with rotation