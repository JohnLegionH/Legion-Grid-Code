;;
;; This file defines the common settings for an OpenSimulator region
;; that is connected to a grid.
;;

[Startup]
    ;; We are assuming that this simulator is connecting to a grid, so we will use the
    ;; Remote connectors.
    AssetServices           = "RegionAssetConnector"
    InventoryServices       = "RemoteXInventoryServicesConnector"
    GridServices            = "RegionGridServicesConnector"
    AvatarServices          = "RemoteAvatarServicesConnector"
    NeighbourServices       = "NeighbourServicesOutConnector"
    AuthenticationServices  = "RemoteAuthenticationServicesConnector"
    PresenceServices        = "RemotePresenceServicesConnector"
    UserAccountServices     = "RemoteUserAccountServicesConnector"
    GridUserServices        = "RemoteGridUserServicesConnector"
    SimulationServices      = "RemoteSimulationConnectorModule"
    LandServices            = "RemoteLandServicesConnector"

;;
;; *** CORRECTED FOR LOCAL LOOPBACK AND FIREWALL ISSUE ***
;; This section forces this local simulator to contact its own grid services
;; using the reliable 127.0.0.1 address. This bypasses the problematic
;; public IP loopback path that the Windows Firewall is blocking.
;; This is the correct file for these overrides in a grid configuration.
;;

[GridService]
    GridServerURI = "http://127.0.0.1:8002"

[AssetService]
    AssetServerURI = "http://127.0.0.1:8003"

[InventoryService]
    InventoryServerURI = "http://127.0.0.1:8003"

[AvatarService]
    AvatarServerURI = "http://127.0.0.1:8003"

[AuthenticationService]
    AuthenticationServerURI = "http://127.0.0.1:8003"

[PresenceService]
    PresenceServerURI = "http://127.0.0.1:8003"

[UserAccountService]
    UserAccountServerURI = "http://127.0.0.1:8003"
  
[GridUserService]
    GridUserServerURI = "http://127.0.0.1:8003"

[FriendsService]
    FriendsServerURI = "http://127.0.0.1:8003"

[MapImageService]
    MapImageServerURI = "http://127.0.0.1:8003"

[Groups]
    GroupsServerURI = "http://127.0.0.1:8003"

[Messaging]
    OfflineMessageURL = "http://127.0.0.1:8003"

[MuteListService]
    MuteListServerURI = "http://127.0.0.1:8003"

[LandService]
    LandServerURI = "http://127.0.0.1:8003"

[SimulationService]
    ;; You must specify this to get remote simulation services
    ;; This is the grid's simulation service.
    SimulationServerURI = "http://127.0.0.1:8003"

[EstateDataStore]
    LocalServiceModule = "OpenSim.Services.Connectors.dll:EstateDataRemoteConnector"
