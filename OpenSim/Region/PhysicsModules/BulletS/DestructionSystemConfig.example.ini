;; ========================================================================
;; OpenSim Destruction System Configuration Example
;; ========================================================================
;; This file shows example configuration for the OpenSim destruction physics system.
;; Add this section to your OpenSim.ini or OpenSimDefaults.ini file.
;; 
;; The destruction system provides realistic object destruction with fragments,
;; particle effects, sound effects, and optional chain reactions.
;; ========================================================================

[DestructionSystem]
    ;; ===================== Core Settings =====================
    
    ;; Master enable/disable for the destruction system
    ;; Set to true to enable destruction physics in this region
    Enabled = false
    
    ;; Enable admin console commands for destruction system control
    ;; Allows admins to use commands like "destruction enable", "destruction test", etc.
    AdminCommandsEnabled = true
    
    ;; Enable LSL script extensions for destruction physics
    ;; Allows scripts to trigger and control destruction events
    LSLExtensionsEnabled = true
    
    ;; ===================== Performance Settings =====================
    
    ;; Update rate in Hz (1-60, higher = smoother but more CPU)
    ;; Recommended: 10 Hz for good balance of performance and smoothness
    UpdateRate = 10.0
    
    ;; Maximum destructible objects per region (1-1000)
    ;; Prevents memory overload from too many destructible objects
    MaxDestructibleObjects = 100
    
    ;; Maximum fragments per destroyed object (1-50)
    ;; Lower values improve performance but reduce visual impact
    MaxFragmentsPerObject = 15
    
    ;; Maximum total fragments in region (1-1000)
    ;; Global limit to prevent region overload
    MaxTotalFragments = 200
    
    ;; Fragment lifetime in seconds before cleanup (1-300)
    ;; How long debris remains before being automatically cleaned up
    FragmentLifetime = 60.0
    
    ;; Enable adaptive performance scaling to maintain frame rate
    ;; Automatically reduces quality during high load
    EnableAdaptivePerformance = true
    
    ;; Target frame time in milliseconds (10-100)
    ;; System will reduce quality if frame times exceed this target
    TargetFrameTime = 22.0
    
    ;; Performance batch size for processing (1-20)
    ;; Number of objects to process per frame
    PerformanceBatchSize = 4
    
    ;; ===================== Visual Effects =====================
    
    ;; Enable particle effects for destructions
    ;; Creates dust, sparks, and material-specific particles
    EnableParticleEffects = true
    
    ;; Particle effect intensity multiplier (0.0-3.0)
    ;; 1.0 = normal intensity, higher values = more particles
    ParticleIntensity = 1.0
    
    ;; Enable crack animations before destruction
    ;; Shows cracks spreading before objects break
    EnableCrackAnimations = true
    
    ;; Crack animation intensity multiplier (0.0-3.0)
    CrackIntensity = 1.0
    
    ;; Enable environmental effects (dust clouds, debris)
    ;; Creates atmospheric effects around destruction sites
    EnableEnvironmentalEffects = true
    
    ;; Environmental effects duration multiplier (0.1-5.0)
    EnvironmentalEffectsDuration = 1.0
    
    ;; ===================== Audio Settings =====================
    
    ;; Enable sound effects for destructions
    ;; Plays material-appropriate breaking sounds
    EnableSoundEffects = true
    
    ;; Sound effect intensity multiplier (0.0-3.0)
    SoundIntensity = 1.0
    
    ;; Maximum simultaneous destruction sounds (1-20)
    ;; Prevents audio overload during large destruction events
    MaxSimultaneousSounds = 10
    
    ;; ===================== Physics Settings =====================
    
    ;; Force calculation multiplier (0.1-10.0)
    ;; Scales the physics forces that cause destructions
    ForceMultiplier = 1.0
    
    ;; Enable chain reaction destructions
    ;; Allows destructions to trigger nearby destructions
    ;; WARNING: Can cause performance issues if not tuned carefully
    EnableChainReactions = false
    
    ;; Chain reaction trigger radius in meters (1.0-20.0)
    ;; How far chain reactions can spread
    ChainReactionRadius = 5.0
    
    ;; Chain reaction force transfer efficiency (0.1-1.0)
    ;; How much force is transferred to nearby objects
    ChainReactionForceMultiplier = 0.7
    
    ;; Maximum chain reaction depth (1-10)
    ;; Prevents infinite chain reactions
    MaxChainReactionDepth = 3
    
    ;; Enable structural integrity simulation
    ;; Objects can fail due to stress even without direct impact
    EnableStructuralIntegrity = true
    
    ;; Structural failure threshold (0.1-1.0)
    ;; Lower values make objects break more easily
    StructuralIntegrityThreshold = 0.3
    
    ;; ===================== Persistence Settings =====================
    
    ;; Enable persistent destruction state across restarts
    ;; Destruction state is saved and restored on region restart
    EnablePersistence = true
    
    ;; Save interval for destruction state in seconds (30-600)
    ;; How often to save destruction state to disk
    PersistenceSaveInterval = 300.0
    
    ;; Maximum destruction records to keep (100-10000)
    MaxDestructionRecords = 1000
    
    ;; Enable automatic repair system for destroyed objects
    ;; Destroyed objects can automatically repair over time
    EnableRepairSystem = true
    
    ;; Default repair time in seconds (10-3600)
    ;; How long it takes for destroyed objects to repair
    DefaultRepairTime = 300.0
    
    ;; ===================== Debug Settings =====================
    
    ;; Enable detailed destruction logging
    ;; Logs detailed information about destruction events
    ;; WARNING: Can generate large log files
    EnableDestructionLogging = false
    
    ;; Enable performance profiling and reporting
    ;; Generates performance reports for optimization
    EnablePerformanceProfiling = true
    
    ;; Performance report interval in seconds (10-600)
    ;; How often to generate performance reports
    PerformanceReportInterval = 60.0

